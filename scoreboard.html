<!doctype html><html lang="ur"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لائیو کرکٹ اسکور بورڈ</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;color:#fff;font-family:Arial,sans-serif}.board{width:100vw;height:100vh;min-height:400px;display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(125deg,#07182b 0%,#0b554e 52%,#10243b 100%);border:5px solid #f5bd45;position:relative;overflow:hidden}.top{display:flex;align-items:center;justify-content:space-between;padding:2.2vh 3vw;background:#071321d9;border-bottom:3px solid #f5bd45;gap:20px}.match{font-size:clamp(18px,2.4vw,38px);font-weight:900;letter-spacing:1px}.live{background:#e72c43;padding:9px 18px;border-radius:30px;font-weight:bold;letter-spacing:2px;font-size:clamp(12px,1.3vw,20px)}.teams{display:grid;grid-template-columns:1fr 1.15fr 1fr;align-items:center;gap:2vw;padding:3vh 4vw;flex:1}.team{text-align:center}.flag{font-size:clamp(45px,7vw,105px);line-height:1.15}.teamname{font-size:clamp(18px,2.5vw,38px);font-weight:900;margin-top:10px}.score{text-align:center}.runs{font-size:clamp(48px,9vw,130px);font-weight:1000;line-height:1.05;color:#fff}.overs{font-size:clamp(17px,2vw,30px);color:#ffe08a;margin-top:10px}.target{font-size:clamp(13px,1.5vw,23px);margin-top:10px;color:#cfeee5}.players{display:grid;grid-template-columns:1fr 1fr;gap:18px;padding:0 3vw 2.5vh}.player{background:#071321c9;border:1px solid #52766f;border-left:5px solid #f5bd45;border-radius:15px;padding:14px 18px;display:flex;align-items:center;gap:15px;min-width:0}.photo{width:clamp(54px,7vw,100px);height:clamp(54px,7vw,100px);border-radius:50%;object-fit:cover;background:#294b57;border:3px solid #f5bd45;flex-shrink:0}.pname{font-size:clamp(16px,2vw,28px);font-weight:bold;overflow-wrap:anywhere}.pstats{font-size:clamp(13px,1.4vw,21px);color:#d5e9e4;margin-top:7px}.rr{font-size:clamp(13px,1.5vw,22px);color:#ffe08a;margin-top:6px}.ticker{background:#f5bd45;color:#102238;font-size:clamp(14px,1.8vw,27px);font-weight:bold;white-space:nowrap;overflow:hidden;padding:12px 0}.ticker span{display:inline-block;padding-left:100%;animation:scroll 22s linear infinite}@keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-100%)}}.error{position:absolute;bottom:55px;left:12px;background:#900;color:#fff;padding:5px 9px;font-size:12px;display:none}@media(max-aspect-ratio:1/1){.teams{padding:2vh 2vw;gap:1vw}.players{padding:0 2vw 2vh;gap:8px}.player{padding:8px;gap:8px}}
</style></head><body><main class="board"><header class="top"><div class="match" id="match">LIVE CRICKET MATCH</div><div class="live">● LIVE</div></header><section class="teams"><div class="team"><div class="flag" id="flag1">🇵🇰</div><div class="teamname" id="team1">Pakistan</div></div><div class="score"><div class="runs"><span id="runs">0</span><span style="color:#f5bd45">/</span><span id="wickets">0</span></div><div class="overs">OVERS <span id="overs">0</span>.<span id="balls">0</span></div><div class="target" id="targetLine">TARGET: —</div><div class="rr" id="runrateLine">RUN RATE: 0.00</div></div><div class="team"><div class="flag" id="flag2">🇮🇳</div><div class="teamname" id="team2">India</div></div></section><section class="players"><div class="player"><img class="photo" id="batterPhoto" alt="Batter" hidden><div><div class="pname">🏏 <span id="batter">بیٹسمین</span></div><div class="pstats"><span id="batterRuns">0</span> رنز (<span id="batterBalls">0</span> گیندیں)</div></div></div><div class="player"><img class="photo" id="bowlerPhoto" alt="Bowler" hidden><div><div class="pname">🎯 <span id="bowler">بولر</span></div><div class="pstats"><span id="bowlerRuns">0</span> رنز دیے · <span id="bowlerWickets">0</span> وکٹیں</div></div></div></section><footer class="ticker"><span id="ticker">لائیو کرکٹ میچ — ہمارے ساتھ رہیے</span></footer><div class="error" id="error">Firebase ترتیب چیک کریں</div></main><script src="config.js"></script><script>
const textIds=['match','team1','team2','runs','wickets','overs','balls','batter','batterRuns','batterBalls','bowler','bowlerRuns','bowlerWickets','ticker'];let last='';function base(){const c=window.CRICKET_CONFIG||{};if(!c.databaseURL||c.databaseURL.includes('PASTE_'))throw new Error('config.js میں databaseURL درج کریں');return c.databaseURL.replace(/\/$/,'')+'/'+(c.room||'main-match')+'.json'}function setPhoto(id,value){const el=document.getElementById(id);if(value&&/^https?:\/\//i.test(value)){el.src=value;el.hidden=false;el.onerror=()=>{el.hidden=true}}else{el.removeAttribute('src');el.hidden=true}}function render(d){if(!d)return;textIds.forEach(id=>{if(d[id]!==undefined)document.getElementById(id).textContent=d[id]});document.getElementById('flag1').textContent=d.flag1||'🏏';document.getElementById('flag2').textContent=d.flag2||'🏏';document.getElementById('targetLine').textContent=Number(d.target)>0?'TARGET: '+d.target:'TARGET: —';document.getElementById('runrateLine').textContent='RUN RATE: '+(Number(d.runrate)||0).toFixed(2);setPhoto('batterPhoto',d.batterPhoto);setPhoto('bowlerPhoto',d.bowlerPhoto)}async function refresh(){try{const r=await fetch(base(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const d=await r.json();if(d){const key=JSON.stringify(d);if(key!==last){render(d);last=key}}document.getElementById('error').style.display='none'}catch(e){document.getElementById('error').style.display='block'}}refresh();setInterval(refresh,1200);
</script></body></html>
